name: API Tests (manual / PR)

# This workflow runs API tests in isolation — useful for PRs and manual triggers
# where docker-build-push.yml hasn't run yet (images already exist in GHCR).
# On push to main the api-tests job inside docker-build-push.yml takes over.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - local

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker compose up -d
          echo "Waiting for services to initialise..."
          sleep 90

      - name: Wait for proxy service to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Proxy service is ready"
              break
            fi
            echo "Attempt $i: not ready yet, waiting 10s..."
            sleep 10
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install

      - name: Build API tests Docker image
        working-directory: tests/postman
        run: docker build -t cinemaabyss-api-tests .

      - name: Run API tests
        working-directory: tests/postman
        run: |
          mkdir -p reports
          docker run \
            --network=cinemaabyss-network \
            -v "$(pwd)/reports:/app/reports" \
            cinemaabyss-api-tests \
            node run-tests.js --environment ${{ inputs.environment || 'docker' }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: tests/postman/reports/

      - name: Stop services
        if: always()
        run: docker compose down
