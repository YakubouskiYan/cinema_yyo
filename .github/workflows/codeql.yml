name: CodeQL (scheduled)

# Weekly scheduled run only.
#
# Push and PR triggers are intentionally absent — CodeQL is embedded as
# Job 2 in docker-build-push.yml where it runs in parallel with unit tests
# and acts as a hard gate blocking image builds on any finding.
# Running it again here on push/PR would be a duplicate with no benefit.
#
# This file exists solely to catch newly published CVEs in the CodeQL
# database for code that was already merged and deployed to production.
on:
  schedule:
    # Every Monday at 03:00 UTC — catches newly published CVEs in static DB
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write  # needed to upload SARIF results

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, go]
        # java-kotlin = CodeQL language ID for Java 21 projects
        # go          = CodeQL language ID for Go modules

    steps:
      - uses: actions/checkout@v4

      # ── Java setup ──────────────────────────────────────────────────────────
      # CodeQL needs to trace the actual compilation for Java;
      # auto-build alone is insufficient for multi-module Maven projects.
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # ── CodeQL init ─────────────────────────────────────────────────────────
      # security-extended  → OWASP Top 10, injection, crypto issues
      # security-and-quality → adds code quality checks on top
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended, security-and-quality

      # ── Build: Java ─────────────────────────────────────────────────────────
      # Build both Maven modules so CodeQL can trace all compilation units.
      # -DskipTests: we only need .class files for analysis, not test results.
      - name: Build Java services (for CodeQL tracing)
        if: matrix.language == 'java-kotlin'
        run: |
          mvn verify -B --no-transfer-progress -DskipTests \
            -f src/microservices/proxy/pom.xml
          mvn verify -B --no-transfer-progress -DskipTests \
            -f src/microservices/events/pom.xml

      # ── Build: Go ───────────────────────────────────────────────────────────
      # autobuild works well for Go — it runs go build on all detected modules.
      - name: Autobuild Go services
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@v3

      # ── Analysis ────────────────────────────────────────────────────────────
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}
          # Results appear in: Security → Code scanning alerts
