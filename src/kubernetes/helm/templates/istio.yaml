{{- if .Values.istio.enabled }}
# =============================================================================
# Istio mTLS + Circuit Breaker + Traffic Management
# Generated by Helm — enable with: --set istio.enabled=true
# Before enabling, label the namespace manually:
#   kubectl label namespace {{ .Values.global.namespace }} istio-injection=enabled --overwrite
# =============================================================================

# --- PeerAuthentication: enforce mTLS STRICT for the entire namespace -------
# All pod-to-pod traffic inside the namespace must use mTLS.
# Plain HTTP between services is rejected by the Istio sidecar.
# TLS certificates are issued and rotated automatically by Istio.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: cinemaabyss-mtls
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  mtls:
    mode: {{ .Values.istio.mtls.mode }}
---
# --- movies-service: DestinationRule (Circuit Breaker) ----------------------
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: movies-service-circuit-breaker
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  host: movies-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: {{ .Values.istio.moviesService.circuitBreaker.maxConnections }}
      http:
        http1MaxPendingRequests: {{ .Values.istio.moviesService.circuitBreaker.http1MaxPendingRequests }}
        maxRequestsPerConnection: {{ .Values.istio.moviesService.circuitBreaker.maxRequestsPerConnection }}
    outlierDetection:
      consecutive5xxErrors: {{ .Values.istio.moviesService.circuitBreaker.consecutive5xxErrors }}
      interval: {{ .Values.istio.moviesService.circuitBreaker.interval }}
      baseEjectionTime: {{ .Values.istio.moviesService.circuitBreaker.baseEjectionTime }}
      maxEjectionPercent: {{ .Values.istio.moviesService.circuitBreaker.maxEjectionPercent }}
---
# --- movies-service: VirtualService (Timeouts & Retries) --------------------
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: movies-service-vs
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  hosts:
  - movies-service
  http:
  - name: movies-route
    timeout: {{ .Values.istio.moviesService.virtualService.timeout }}
    retries:
      attempts: {{ .Values.istio.moviesService.virtualService.retries.attempts }}
      perTryTimeout: {{ .Values.istio.moviesService.virtualService.retries.perTryTimeout }}
      retryOn: "connect-failure,refused-stream,unavailable,cancelled,retriable-4xx"
    route:
    - destination:
        host: movies-service
        port:
          number: {{ .Values.moviesService.service.port }}
---
# --- monolith: DestinationRule (Circuit Breaker) ----------------------------
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: monolith-circuit-breaker
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  host: monolith
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: {{ .Values.istio.monolith.circuitBreaker.maxConnections }}
      http:
        http1MaxPendingRequests: {{ .Values.istio.monolith.circuitBreaker.http1MaxPendingRequests }}
        http2MaxRequests: {{ .Values.istio.monolith.circuitBreaker.http2MaxRequests }}
        maxRequestsPerConnection: {{ .Values.istio.monolith.circuitBreaker.maxRequestsPerConnection }}
    outlierDetection:
      consecutive5xxErrors: {{ .Values.istio.monolith.circuitBreaker.consecutive5xxErrors }}
      interval: {{ .Values.istio.monolith.circuitBreaker.interval }}
      baseEjectionTime: {{ .Values.istio.monolith.circuitBreaker.baseEjectionTime }}
      maxEjectionPercent: {{ .Values.istio.monolith.circuitBreaker.maxEjectionPercent }}
---
# --- monolith: VirtualService (Timeouts & Retries) --------------------------
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: monolith-vs
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  hosts:
  - monolith
  http:
  - name: monolith-route
    timeout: {{ .Values.istio.monolith.virtualService.timeout }}
    retries:
      attempts: {{ .Values.istio.monolith.virtualService.retries.attempts }}
      perTryTimeout: {{ .Values.istio.monolith.virtualService.retries.perTryTimeout }}
      retryOn: "connect-failure,refused-stream,unavailable,cancelled,retriable-4xx"
    route:
    - destination:
        host: monolith
        port:
          number: {{ .Values.monolith.service.port }}
{{- end }}
